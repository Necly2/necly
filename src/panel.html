<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>PVZ Avito</title>
<style>
 *{box-sizing:border-box}
 body{margin:0;width:320px;height:100vh;padding:14px;font:13px "Segoe UI",system-ui,sans-serif;background:#f4f6f8;color:#222;overflow-y:auto;border-right:1px solid #ccd}
 h2{margin:0 0 4px;font-size:17px}
 .sub{color:#667;margin-bottom:12px}
 .nav{display:flex;gap:6px;margin-bottom:12px}
 .nav button{flex:1;padding:5px;background:#fff;border:1px solid #bbc;border-radius:5px;cursor:pointer}
 fieldset{border:1px solid #ccd;border-radius:8px;padding:8px 10px;margin:0 0 10px;background:#fff}
 legend{color:#556;padding:0 4px}
 label{display:flex;justify-content:space-between;align-items:center;margin:5px 0}
 input[type=number]{width:70px;padding:3px}
 #root{font-size:11px;color:#445;word-break:break-all;margin:4px 0}
 .small{padding:3px 8px;font-size:12px;cursor:pointer}
 #go{width:100%;padding:11px;font-size:15px;border:0;border-radius:8px;background:#00aaff;color:#fff;cursor:pointer}
 #go:disabled{background:#9ab}
 #stop{width:100%;padding:7px;margin-top:6px;border:1px solid #c33;border-radius:8px;background:#fff;color:#c33;cursor:pointer;display:none}
 #status{margin-top:10px;padding:8px;background:#fff;border-radius:8px;border:1px solid #ccd;min-height:60px;white-space:pre-line}
 #url{font-size:11px;color:#889;word-break:break-all;margin-top:10px}
 .warn{color:#b60}
</style></head><body>
<h2>PVZ · Авито</h2>
<div class="sub">Выставьте фильтры в окне справа, затем нажмите «Выгрузить».</div>
<div class="nav"><button id="back">← Назад</button><button id="home">Аренда Москва</button><button id="reload">⟳</button></div>
<fieldset><legend>Настройки</legend>
 <label>Страниц максимум <input id="pages" type="number" min="1" max="100"></label>
 <label>Пауза между стр., с <input id="delay" type="number" min="3" max="60"></label>
 <label>Не старше, дней (0 = все) <input id="days" type="number" min="0" max="90"></label>
 <label>Строк в файле <input id="part" type="number" min="50" max="1000"></label>
</fieldset>
<fieldset><legend>Куда сохранять (папка АДРЕСА)</legend>
 <div id="root"></div>
 <button class="small" id="pick">Выбрать…</button> <button class="small" id="open">Открыть</button>
 <div style="font-size:11px;color:#778;margin-top:4px">Файлы: &lt;Месяц&gt;\Адреса ДД AVITO\avito ДД N.xlsx</div>
</fieldset>
<button id="go">Выгрузить текущий поиск</button>
<button id="stop">Остановить и сохранить собранное</button>
<div id="status">Готово к работе.</div>
<div id="url"></div>
<div style="margin-top:10px;font-size:11px;color:#778">Сборка <span id="ver">?</span> · <a href="#" id="upd">Проверить обновления</a></div>
<script src="panel.js"></script>
</body></html>
