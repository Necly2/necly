name: Build Lenta for Windows

on:
  push:
    branches: [lenta-windows]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: |
          dotnet publish src/Lenta.csproj -c Release -r win-x64 --self-contained true \
            -p:Version=1.0.${{ github.run_number }} \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -o out
          ls -la out

      - name: Package
        run: |
          7z a Lenta-Windows.zip ./out/Lenta.exe
          echo "${{ github.run_number }}" > version.txt
          ls -la Lenta-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lenta-Windows
          path: Lenta-Windows.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "## Что нового в сборке ${{ github.run_number }}"; echo; cat WHATSNEW.md; echo;
            echo "[Вся история изменений](https://github.com/Necly2/necly/blob/lenta-windows/CHANGELOG.md)"; echo; echo "---"; echo;
            cat README.md; } > release-notes.md
          cp WHATSNEW.md notes.txt
          TAG="lenta-windows-latest"
          gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" Lenta-Windows.zip version.txt notes.txt -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Лента 📰 для Windows" \
            --notes-file release-notes.md

      - name: Update changelog
        continue-on-error: true
        run: |
          if [ -f WHATSNEW.md ] && ! cmp -s WHATSNEW.md .github/last-whatsnew.md; then
            DATE=$(date +%d.%m.%Y)
            { head -n 2 CHANGELOG.md; echo "## Сборка ${{ github.run_number }} — $DATE"; echo; cat WHATSNEW.md; echo; tail -n +3 CHANGELOG.md; } > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
            cp WHATSNEW.md .github/last-whatsnew.md
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add CHANGELOG.md .github/last-whatsnew.md
            git commit -m "История изменений: сборка ${{ github.run_number }} [skip ci]"
            git push
          fi
