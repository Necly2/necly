name: Build PVZ Avito (Windows + Mac)

on:
  push:
    branches: [avito-windows]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          npm ci
          npm pkg set version=1.0.${{ github.run_number }}

      - name: Package
        run: |
          npx @electron/packager . "PVZ Avito" --platform=win32 --arch=x64 --asar --overwrite --out=dist \
            --app-version=1.0.${{ github.run_number }} \
            --ignore="^/\.github" --ignore="^/dist" --ignore="\.md$" --ignore="\.zip$"
          cd dist && mv "PVZ Avito-win32-x64" "PVZ Avito" && 7z a ../PVZ-Avito-Windows.zip "PVZ Avito" && cd ..
          cp "dist/PVZ Avito/resources/app.asar" app.asar
          echo "${{ github.run_number }}" > version.txt
          ls -la PVZ-Avito-Windows.zip app.asar

      - uses: actions/upload-artifact@v4
        with:
          name: PVZ-Avito-Windows
          path: PVZ-Avito-Windows.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "## Что нового в сборке ${{ github.run_number }}"; echo; cat WHATSNEW.md; echo;
            echo "[Вся история изменений](https://github.com/Necly2/necly/blob/avito-windows/CHANGELOG.md)"; echo; echo "---"; echo;
            cat README.md; } > release-notes.md
          cp WHATSNEW.md notes.txt
          TAG="avito-windows-latest"
          gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" PVZ-Avito-Windows.zip app.asar version.txt notes.txt -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PVZ Avito 🏢 для Windows" \
            --notes-file release-notes.md

      - name: Update changelog
        continue-on-error: true
        run: |
          if [ -f WHATSNEW.md ] && ! cmp -s WHATSNEW.md .github/last-whatsnew.md; then
            DATE=$(date +%d.%m.%Y)
            { head -n 2 CHANGELOG.md; echo "## Сборка ${{ github.run_number }} — $DATE"; echo; cat WHATSNEW.md; echo; tail -n +3 CHANGELOG.md; } > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
            cp WHATSNEW.md .github/last-whatsnew.md
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add CHANGELOG.md .github/last-whatsnew.md
            git commit -m "История изменений: сборка ${{ github.run_number }} [skip ci]"
            git push
          fi

  build-mac:
    name: Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          npm ci
          npm pkg set version=1.0.${{ github.run_number }}

      - name: Package (Apple Silicon + Intel)
        run: |
          for ARCH in arm64 x64; do
            npx @electron/packager . "PVZ Avito" --platform=darwin --arch=$ARCH --asar --overwrite --out=dist \
              --app-version=1.0.${{ github.run_number }} --app-bundle-id=ru.necly.pvzavito \
              --ignore="^/\.github" --ignore="^/dist" --ignore="\.md$" --ignore="\.zip$"
            APP="dist/PVZ Avito-darwin-$ARCH/PVZ Avito.app"
            codesign --force --deep -s - "$APP"
            codesign --verify --deep "$APP"
            ditto -c -k --keepParent "$APP" "PVZ-Avito-Mac-$ARCH.zip"
          done
          cp "dist/PVZ Avito-darwin-arm64/PVZ Avito.app/Contents/Resources/app.asar" app.asar
          echo "${{ github.run_number }}" > version.txt
          ls -la *.zip app.asar

      - uses: actions/upload-artifact@v4
        with:
          name: PVZ-Avito-Mac
          path: PVZ-Avito-Mac-*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "## Что нового в сборке ${{ github.run_number }}"; echo; cat WHATSNEW.md; echo;
            echo "[Вся история изменений](https://github.com/Necly2/necly/blob/avito-windows/CHANGELOG.md)"; echo; echo "---"; echo;
            cat README.md; } > release-notes.md
          cp WHATSNEW.md notes.txt
          TAG="avito-mac-latest"
          gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" PVZ-Avito-Mac-arm64.zip PVZ-Avito-Mac-x64.zip app.asar version.txt notes.txt -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PVZ Avito 🏢 для Mac" \
            --notes-file release-notes.md
