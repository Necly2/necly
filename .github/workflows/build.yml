name: Build PVZ Master (Windows + Mac)

on:
  push:
    branches: [avito-windows]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          npm ci
          npm pkg set version=1.0.${{ github.run_number }}

      - name: Package
        run: |
          npx @electron/packager . "PVZ Master" --platform=win32 --arch=x64 --asar --overwrite --out=dist \
            --app-version=1.0.${{ github.run_number }} --icon=build/icon.ico \
            --ignore="^/\.github" --ignore="^/dist" --ignore="^/build" --ignore="\.md$" --ignore="\.zip$"
          cd dist && mv "PVZ Master-win32-x64" "PVZ Master" && 7z a ../PVZ-Master-Windows.zip "PVZ Master" && cd ..
          cp "dist/PVZ Master/resources/app.asar" app.asar
          echo "${{ github.run_number }}" > version.txt

      - name: Installer (Setup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" build\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem PVZ-Master-Setup.exe, PVZ-Master-Windows.zip, app.asar | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PVZ-Master-Windows
          path: PVZ-Master-Setup.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "## Что нового в сборке ${{ github.run_number }}"; echo; cat WHATSNEW.md; echo;
            echo "[Вся история изменений](https://github.com/Necly2/necly/blob/avito-windows/CHANGELOG.md)"; echo; echo "---"; echo;
            cat README.md; } > release-notes.md
          cp WHATSNEW.md notes.txt
          TAG="avito-windows-latest"
          gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" PVZ-Master-Setup.exe PVZ-Master-Windows.zip app.asar version.txt notes.txt -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PVZ Master 🏢 для Windows" \
            --notes-file release-notes.md

      - name: Update changelog
        continue-on-error: true
        run: |
          if [ -f WHATSNEW.md ] && ! cmp -s WHATSNEW.md .github/last-whatsnew.md; then
            DATE=$(date +%d.%m.%Y)
            { head -n 2 CHANGELOG.md; echo "## Сборка ${{ github.run_number }} — $DATE"; echo; cat WHATSNEW.md; echo; tail -n +3 CHANGELOG.md; } > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
            cp WHATSNEW.md .github/last-whatsnew.md
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add CHANGELOG.md .github/last-whatsnew.md
            git commit -m "История изменений: сборка ${{ github.run_number }} [skip ci]"
            git push
          fi

  build-mac:
    name: Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          npm ci
          npm pkg set version=1.0.${{ github.run_number }}

      - name: Package (Apple Silicon + Intel)
        run: |
          for ARCH in arm64 x64; do
            npx @electron/packager . "PVZ Master" --platform=darwin --arch=$ARCH --asar --overwrite --out=dist \
              --app-version=1.0.${{ github.run_number }} --app-bundle-id=ru.necly.pvzavito --icon=build/icon.icns \
              --ignore="^/\.github" --ignore="^/dist" --ignore="^/build" --ignore="\.md$" --ignore="\.zip$"
            APP="dist/PVZ Master-darwin-$ARCH/PVZ Master.app"
            codesign --force --deep -s - "$APP"
            codesign --verify --deep "$APP"
            ditto -c -k --keepParent "$APP" "PVZ-Master-Mac-$ARCH.zip"
          done
          cp "dist/PVZ Master-darwin-arm64/PVZ Master.app/Contents/Resources/app.asar" app.asar
          echo "${{ github.run_number }}" > version.txt
          ls -la *.zip app.asar

      - uses: actions/upload-artifact@v4
        with:
          name: PVZ-Master-Mac
          path: PVZ-Master-Mac-*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "## Что нового в сборке ${{ github.run_number }}"; echo; cat WHATSNEW.md; echo;
            echo "[Вся история изменений](https://github.com/Necly2/necly/blob/avito-windows/CHANGELOG.md)"; echo; echo "---"; echo;
            cat README.md; } > release-notes.md
          cp WHATSNEW.md notes.txt
          TAG="avito-mac-latest"
          gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" PVZ-Master-Mac-arm64.zip PVZ-Master-Mac-x64.zip app.asar version.txt notes.txt -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PVZ Master 🏢 для Mac" \
            --notes-file release-notes.md
