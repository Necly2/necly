name: Build Sugrob

on:
  push:
    branches: [sugrob]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        run: |
          ditto -c -k --keepParent build/Sugrob.app Sugrob.zip
          echo "${{ github.run_number }}" > version.txt
          ls -la Sugrob.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sugrob
          path: Sugrob.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "## Что нового в сборке ${{ github.run_number }}"; echo; cat WHATSNEW.md; echo;
            echo "[Вся история изменений](https://github.com/Necly2/necly/blob/sugrob/CHANGELOG.md)"; echo; echo "---"; echo;
            cat README.md; } > release-notes.md
          cp WHATSNEW.md notes.txt
          TAG="sugrob-latest"
          gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" Sugrob.zip version.txt notes.txt -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Сугроб ❄️" \
            --notes-file release-notes.md

      - name: Update changelog
        continue-on-error: true
        run: |
          if [ -f WHATSNEW.md ] && ! cmp -s WHATSNEW.md .github/last-whatsnew.md; then
            DATE=$(date +%d.%m.%Y)
            { head -n 2 CHANGELOG.md; echo "## Сборка ${{ github.run_number }} — $DATE"; echo; cat WHATSNEW.md; echo; tail -n +3 CHANGELOG.md; } > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
            cp WHATSNEW.md .github/last-whatsnew.md
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add CHANGELOG.md .github/last-whatsnew.md
            git commit -m "История изменений: сборка ${{ github.run_number }} [skip ci]"
            git push
          fi
