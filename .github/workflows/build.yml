name: Build Lenta for Windows

on:
  push:
    branches: [lenta-windows]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: |
          dotnet publish src/Lenta.csproj -c Release -r win-x64 --self-contained true \
            -p:Version=1.0.${{ github.run_number }} \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -o out
          ls -la out

      - name: Package
        run: |
          7z a Lenta-Windows.zip ./out/Lenta.exe
          echo "${{ github.run_number }}" > version.txt
          ls -la Lenta-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lenta-Windows
          path: Lenta-Windows.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="lenta-windows-latest"
          gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" Lenta-Windows.zip version.txt -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Лента 📰 для Windows" \
            --notes-file README.md
